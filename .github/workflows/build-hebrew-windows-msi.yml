name: Build Hebrew Windows MSI

on:
  push:
    branches:
      - build/hebrew-windows-msi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hebrew-windows-msi-${{ github.sha }}
  cancel-in-progress: true

jobs:
  windows-msi:
    name: Windows x64 Hebrew MSI
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUST_BACKTRACE: 1
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
      CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
      CRAFT_I18N_REQUIRED: "1"

    steps:
      - name: Check out PdfCraft with Hebrew interface support
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the pinned interface translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-i18n
          ref: d81532b594b91063c1811bbefccd06a659b39e71
          path: craft-i18n
          persist-credentials: false

      - name: Check out the release-pinned font set
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts

      - name: Install Rust and the Windows target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: hebrew-msi-windows-x64

      - name: Install WiX 5.0.2 and MSI extensions
        uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: 5.0.2
          install-extensions: "true"

      - name: Verify Hebrew translation resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path (Join-Path $env:CRAFT_I18N_DIR 'locales/he/pdfcraft.tsv'))) {
            throw 'The pinned Hebrew PdfCraft translation catalog is missing.'
          }
          if (-not (Select-String -Path 'crates/ui-egui/src/i18n.rs' -Pattern 'code: "he".*rtl: true' -Quiet)) {
            throw 'Hebrew is not registered as a right-to-left interface language.'
          }

      - name: Test UI library with embedded translations
        shell: pwsh
        run: cargo test --locked -p pdfcraft-ui-egui --lib -- --skip arabic_labels_have_glyphs --skip catalog_rows_keep_the_source_spacing_and_ellipsis --skip japanese_labels_have_glyphs

      - name: Build and package Windows x64 MSI
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: ./packaging/windows/package.ps1 -Arch x64

      - name: Verify MSI and calculate SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem -LiteralPath 'dist/release' -Filter 'pdfcraft-*-windows-x64.msi' | Select-Object -First 1
          if (-not $msi) {
            throw 'The Windows x64 MSI was not created.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $msi.FullName
          if ($signature.Status -eq 'Valid') {
            Write-Host "MSI signature is valid: $($signature.SignerCertificate.Subject)"
          } elseif ($signature.Status -eq 'NotSigned') {
            Write-Warning 'The MSI is unsigned; Windows may show a publisher warning.'
          } else {
            throw "MSI signature validation failed: $($signature.Status) $($signature.StatusMessage)"
          }
          $hash = (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($msi.Name)" | Set-Content -LiteralPath "$($msi.FullName).sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Upload the standalone MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PdfCraft-Hebrew-MSI-windows-x64
          path: |
            dist/release/pdfcraft-*-windows-x64.msi
            dist/release/pdfcraft-*-windows-x64.msi.sha256
          if-no-files-found: error
          retention-days: 30
